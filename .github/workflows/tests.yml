name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fritech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fritech_test
      FLASK_SECRET_KEY: valor-falso-solo-para-ci
      JWT_PWA_SECRET: otro-valor-falso-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest tests/ --ignore=tests/test_asistencia_api.py --ignore=tests/e2e -v

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fritech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fritech_test
      FLASK_SECRET_KEY: valor-falso-solo-para-ci
      JWT_PWA_SECRET: otro-valor-falso-solo-para-ci
      PORT: "5005"
      E2E_BASE_URL: http://localhost:5005

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # El sandbox de desarrollo trae Chromium preinstalado (ver
      # tests/e2e/conftest.py); este runner de GitHub Actions no, así que
      # acá sí hace falta instalarlo explícitamente.
      - run: python -m playwright install --with-deps chromium

      - run: python -m backend.scripts.seed_test_data

      - name: Levantar el servidor Flask en background
        run: |
          nohup python -m backend.app > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$E2E_BASE_URL/" > /dev/null && break
            sleep 1
          done

      - run: python -m pytest tests/e2e/ -v

      - name: Log del servidor (siempre, para diagnosticar fallos)
        if: always()
        run: cat app.log || true